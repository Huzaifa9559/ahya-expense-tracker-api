[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahya-expense-tracker-api"
version = "0.1.0"
description = "Ahya multi-currency expense tracker API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "arq==0.26.1",
    "aioboto3==13.3.0",
    "argon2-cffi==23.1.0",
    "PyJWT==2.10.1",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==1.2.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "moto[server]==5.0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Same loop for tests + session-scoped engine (avoids asyncpg "different loop" errors).
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async runs business code inside greenlets; without this, service
# coverage is badly under-counted even when tests exercise those lines.
concurrency = ["greenlet"]

[tool.coverage.report]
show_missing = true
skip_empty = true
